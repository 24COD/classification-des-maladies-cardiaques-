services:
  - type: web
    name: cardiorisk-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn API.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  - type: web
    name: cardiorisk-streamlit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run APP/app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: cardiorisk-api
          property: hostport
